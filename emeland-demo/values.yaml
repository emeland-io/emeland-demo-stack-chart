
# Subchart toggles (gated by condition: in Chart.yaml — skips the subchart entirely when false).
kube-prometheus-stack:
  enabled: true

# metrics-server provides the Metrics API (kubectl top, HPA, and the homepage
# cluster widget). On KinD the kubelet serves a self-signed cert, so we must
# skip TLS verification with --kubelet-insecure-tls.
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls

modelsrv-k8s-sensor:
  enabled: true
  # This sets the image tag for the modelsrv-k8s-sensor subchart. By default, it uses the appVersion defined in the Chart.yaml of the modelsrv-k8s-sensor subchart.
  image:
    tag: "v0.6.2"
    repository: ghcr.io/emeland-io/modelsrv-k8s-sensor
  manager:
    subscriberUrls:
      - "http://emeland-demo-filter:80/api/"

# Default values for emeland-demo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  server:
    registry: ghcr.io/emeland-io
    repository: modelsrv-web-ui-server
    tag: "0.5.3"
    pullPolicy: IfNotPresent
  tools:
    registry: ghcr.io/emeland-io
    repository: emelandctl
    tag: "v0.10.3"
    pullPolicy: IfNotPresent
  gitserver:
    registry: ghcr.io/emeland-io
    repository: emeland-demo-git
    tag: "v0.1.1-rc1"
    pullPolicy: IfNotPresent
  gitsensor:
    registry: ghcr.io/emeland-io
    repository: modelsrv-git-sensor
    tag: "v0.9.2-rc"
    pullPolicy: IfNotPresent
  ociregistrysensor:
    registry: ghcr.io/emeland-io
    repository: modelsrv-oci-registry-sensor
    # No semver release yet; pin to a published tag when available.
    tag: "v0.1.1"
    pullPolicy: IfNotPresent
  filter:
    registry: ghcr.io/emeland-io
    repository: modelsrv
    tag: "v0.10.3"
    pullPolicy: IfNotPresent

