# Component toggles for the parent chart Deployments/Services.
tools:
  enabled: true

# modelsrv-web-ui-server embeds modelsrv in-process (no separate backend sidecar).
server:
  enabled: true
  noAuth: true
  # Demo visibility: show git- and filter-ingested resources without OIDC ownership.
  publicResourceTypes: "System,SystemInstance,Node,NodeType,Context,ContextType,Finding,FindingType,API,APIInstance,Component,ComponentInstance,FilterRule,MergeRule,Artifact,ArtifactInstance"

# Phase0 integrity filter (modelsrv) between sensors and web UI server.
# Flow: gitserver -> gitsensor -> filter -> webserver
#       k8s-sensor -> filter -> webserver (via modelsrv-k8s-sensor.manager.subscriberUrls)
#       ociregistrysensor -> filter -> webserver (when ociregistrysensor.enabled)
# Downstream URLs are passed to modelsrv as SUBSCRIBERS at startup (no register sidecars).
filter:
  enabled: true
  service:
    port: 80
  # Downstream modelsrv instances that receive filtered events (including findings).
  downstreamSubscribers:
    - http://{{ include "emeland-demo.fullname" . }}-server:{{ .Values.service.port }}/api/

gitsensor:
  enabled: true
  # When filter.enabled, events push to the filter Service; otherwise directly to the webserver.
  subscribers: []
  repoPath: /srv/git/test-gitsensor-target.git
  branch: main
  checkoutDir: /work/checkout/test-gitsensor-target
  watchedPaths:
    - watchedDir/
  listenPort: 24100

# OCI registry sensor (modelsrv-oci-registry-sensor). Disabled by default; enable and set registries.
# For GHCR, set repositories (full-registry catalog is denied). Pass the PAT via --set-json; do not commit it.
ociregistrysensor:
  enabled: false
  # When filter.enabled, events push to the filter Service; otherwise directly to the webserver.
  subscribers: []
  pollInterval: "60s"
  # At least one registry is required when enabled.
  registries: []
  # Example:
  # registries:
  #   - url: "ghcr.io"
  #     username: "YOUR_GH_USER"
  #     password: "YOUR_GH_PAT"  # classic PAT with read:packages
  #     repositories:
  #       - "emeland-io/modelsrv"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Shared Gateway (Gateway API) that all HTTPRoutes attach to.
# Requires the Gateway API CRDs and a Gateway controller (e.g. Envoy Gateway)
# installed in the cluster (see: https://gateway-api.sigs.k8s.io/guides/).
gateway:
  # Create the GatewayClass + Gateway with this chart. Set false to attach the
  # routes to a Gateway you manage separately.
  create: true
  # Gateway (and GatewayClass) name. HTTPRoute parentRefs default to this, so
  # the routes and the Gateway always agree.
  name: gateway
  # GatewayClass controller. Default matches Envoy Gateway.
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # How the Envoy data plane is exposed. "LoadBalancer" suits real clusters;
  # the KinD demo overlay switches this to a pinned NodePort (see
  # deploy/gateway-values.yaml).
  service:
    type: LoadBalancer
    # Only used when type is NodePort; pins the HTTP listener's node port.
    nodePort: ""

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: true
  # HTTPRoute annotations. Discovered by the homepage overview page; homepage
  # derives the health selector app.kubernetes.io/name=emeland-demo, which
  # matches the server pod.
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: EmELand Web UI
    gethomepage.dev/group: EmELand
    gethomepage.dev/description: Landscape model and web UI
  # Which Gateways this Route is attached to (defaults to the chart's Gateway).
  parentRefs:
  - name: gateway
    sectionName: http
  # Hostname the server is served on. Override for your environment.
  hostnames:
  - emeland.localtest.me
  # Route everything to the server.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

# -- Expose the kube-prometheus-stack UIs (Grafana/Prometheus/Alertmanager)
# via HTTPRoutes on the same Gateway as the server. Backend service names
# default to the kube-prometheus-stack release-derived names; override the
# `service` field if you install under a different release name.
monitoringRoutes:
  enabled: true
  # Gateways these routes attach to (usually the same as httpRoute.parentRefs).
  parentRefs:
  - name: gateway
    sectionName: http
  # One HTTPRoute per entry.
  routes:
  - name: grafana
    hostname: grafana.localtest.me
    service: '{{ include "emeland-demo.fullname" . }}-grafana'
    port: 80
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Grafana
      gethomepage.dev/group: Observability
      gethomepage.dev/description: Dashboards
      # Homepage builds the health-check label selector from the app name
      # (app.kubernetes.io/name=<app>). Set it to the real subchart pod name.
      gethomepage.dev/app: grafana
  - name: prometheus
    hostname: prometheus.localtest.me
    service: '{{ include "emeland-demo.fullname" . }}-kube-promethe-prometheus'
    port: 9090
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Prometheus
      gethomepage.dev/group: Observability
      gethomepage.dev/description: Metrics and targets
      gethomepage.dev/app: prometheus
  - name: alertmanager
    hostname: alertmanager.localtest.me
    service: '{{ include "emeland-demo.fullname" . }}-kube-promethe-alertmanager'
    port: 9093
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: Alertmanager
      gethomepage.dev/group: Observability
      gethomepage.dev/description: Alerts
      gethomepage.dev/app: alertmanager

# -- Overview landing page (gethomepage/homepage) served at the bare host.
# Runs in Kubernetes "cluster" mode with Gateway API discovery enabled, so it
# auto-detects every HTTPRoute annotated with gethomepage.dev/enabled=true.
# The server and monitoring routes get those annotations automatically.
overview:
  # Enabled by default; requires a Gateway (deploy/gateway.yaml) for the
  # landing-page HTTPRoute to attach to. Disable if you run without a Gateway.
  enabled: true
  image:
    registry: ghcr.io/gethomepage
    repository: homepage
    tag: "v2.4.0"
    pullPolicy: IfNotPresent
  # Bare host that serves the landing page (no subdomain).
  hostname: localtest.me
  # Gateways the landing-page HTTPRoute attaches to.
  parentRefs:
    - name: gateway
      sectionName: http
  # Extra hosts homepage will accept requests for (CSRF/allowed-hosts guard).
  # The pod-IP entry is required for the k8s health probe.
  allowedHosts: "localtest.me"
  # Dashboard title shown at the top of the page.
  title: EmELand Demo Stack

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
