{{- if .Values.monitoringRoutes.enabled -}}
{{- $svcPort := .Values.service.port -}}
{{- $parentRefs := .Values.monitoringRoutes.parentRefs -}}
{{- range .Values.monitoringRoutes.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "emeland-demo.fullname" $ }}-{{ .name }}
  labels:
    {{- include "emeland-demo.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ tpl .service $ }}
          port: {{ .port }}
          weight: 1
{{- end }}
{{- end }}
