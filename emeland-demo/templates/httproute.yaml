{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "emeland-demo.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "emeland-demo.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Attach to the shared Gateway provided by the emeland-platform chart. The
  # Gateway lives in gateway.namespace (a different namespace than this app), so
  # the parentRef names that namespace, and the Gateway must allow routes from
  # this namespace (emeland-platform gateway.allowedRoutesNamespaces=All).
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: http
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ $fullName }}-server
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
