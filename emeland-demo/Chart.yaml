apiVersion: v2
name: emeland-demo
description: A Helm chart to deploy the emeland demo application on Kubernetes.

type: application

version: 0.1.0

# It is recommended to use it with quotes.
appVersion: "0.9.0"

# The emeland-demo chart is the cluster-agnostic EmELand application layer. It
# attaches to a Gateway provided by the emeland-platform chart (see gateway.*)
# and does NOT bundle the monitoring stack, metrics-server, or create the
# Gateway itself.
dependencies:
  - name: modelsrv-k8s-crd
    version: 0.6.2
    repository: "oci://ghcr.io/emeland-io/charts"
    condition: modelsrv-k8s-sensor.enabled

  - name: modelsrv-k8s-sensor
    version: 0.6.2
    repository: "oci://ghcr.io/emeland-io/charts"
    condition: modelsrv-k8s-sensor.enabled
